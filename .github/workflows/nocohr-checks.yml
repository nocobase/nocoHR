name: NocoHR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# This workflow validates pull requests only. It never publishes or deploys an App.
jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [lint, 'format:check', typecheck, test, build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install fixed dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.check }}
        shell: bash
        env:
          CHECK_SCRIPT: ${{ matrix.check }}
        run: pnpm run "$CHECK_SCRIPT" 2>&1 | tee "$RUNNER_TEMP/nocohr-check.log"
      - name: Preserve check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nocohr-check-${{ strategy.job-index }}
          path: ${{ runner.temp }}/nocohr-check.log
          if-no-files-found: ignore
          retention-days: 14
